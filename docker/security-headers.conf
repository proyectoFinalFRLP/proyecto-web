# Headers de seguridad del front (TESIS-130, ADR-008). Se incluye en cada
# `location` de default.conf, no una sola vez en `server`: nginx no hereda los
# `add_header` del nivel de arriba en un location que declara los suyos, y
# /assets/ e /index.html declaran Cache-Control. `always` los manda también en
# las respuestas de error.

# Scripts sólo del propio origen: el bundle de Vite no tiene scripts inline, así
# que un script inyectado no corre aunque llegue al DOM. Los estilos necesitan
# 'unsafe-inline' porque Emotion (MUI) los inserta en runtime con <style>.
# __API_ORIGIN__ lo reemplaza el Dockerfile con el origen de VITE_API_URL: es la
# única conexión que el front abre fuera de su origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Nadie puede meter el front en un iframe (clickjacking). frame-ancestors es el
# equivalente en la CSP; X-Frame-Options cubre a los navegadores que no la leen.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El TLS termina en el proxy de adelante (Caddy), pero el header llega igual al
# navegador. Por HTTP plano (el contenedor en local) el navegador lo ignora.
add_header Strict-Transport-Security "max-age=31536000" always;
