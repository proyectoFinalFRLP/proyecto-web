<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    /* Espejo de theme.css: el exportador de imágenes sólo inlinea reglas del documento. */
    body { margin: 0; background: #0b1220; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { color: #8ed5ff; }
    .ic {
      font-family: 'Material Symbols Outlined';
      font-weight: normal; font-style: normal; line-height: 1;
      letter-spacing: normal; text-transform: none; white-space: nowrap;
      display: inline-block; direction: ltr; flex: none;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
      -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    .dark {
      --bg:#051424; --surface:#122131; --container:#273647; --primary:#38bdf8; --on-primary:#051424;
      --accent:#8ed5ff; --text:#d4e4fa; --text2:#bdc8d1; --border:#3e484f; --input:#0d1c2d;
      --primary-soft:rgba(56,189,248,.14); --raised:#0f172a; --modal:#1c2b3c; --scrim:rgba(5,20,36,.66);
      --sh1:0 1px 2px rgba(0,0,0,.3);
      --sh2:0 12px 32px rgba(0,0,0,.5), 0 0 16px rgba(56,189,248,.12);
      --sh3:0 24px 48px rgba(0,0,0,.6), 0 0 16px rgba(56,189,248,.12);
      --b1:rgba(255,255,255,.06); --b2:rgba(255,255,255,.08); --b3:rgba(255,255,255,.10);
      --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --ok-fg:#a7f3d0;
      --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12); --warn-fg:#fde68a;
      --err:#fb7185; --err-bg:rgba(251,113,133,.12); --err-fg:#fecdd3;
      --info:#38bdf8; --info-bg:rgba(56,189,248,.12); --info-fg:#bae6fd;
      --neu:#94a3b8; --neu-bg:rgba(148,163,184,.12); --neu-fg:#cbd5e1;
      --grid-line:rgba(255,255,255,.07);
    }
    .light {
      --bg:#f8f9fa; --surface:#ffffff; --container:#e1e3e4; --primary:#00629d; --on-primary:#ffffff;
      --accent:#00a3ff; --text:#191c1d; --text2:#3f4852; --border:#bec7d4; --input:#f4f5f6;
      --primary-soft:rgba(0,98,157,.10); --raised:#ffffff; --modal:#ffffff; --scrim:rgba(25,28,29,.44);
      --sh1:0 1px 3px rgba(16,24,40,.06);
      --sh2:0 12px 32px rgba(16,24,40,.12);
      --sh3:0 24px 48px rgba(16,24,40,.16);
      --b1:#bec7d4; --b2:#bec7d4; --b3:#bec7d4;
      --ok:#10b981; --ok-bg:#d1fae5; --ok-fg:#065f46;
      --warn:#f59e0b; --warn-bg:#fef3c7; --warn-fg:#92400e;
      --err:#f43f5e; --err-bg:#ffe4e6; --err-fg:#9f1239;
      --info:#0ea5e9; --info-bg:#e0f2fe; --info-fg:#0c4a6e;
      --neu:#64748b; --neu-bg:#f1f5f9; --neu-fg:#1e293b;
      --grid-line:rgba(25,28,29,.08);
    }
  </style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;tenant&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Precision Logistics&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tenant&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MR&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tenant&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      tenant: this.props.tenant ?? 'Precision Logistics',
      initials: this.props.initials ?? 'MR'
    };
  }
}
</script>
