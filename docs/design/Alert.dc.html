<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:8px;background:{{ bg }};border:1px solid {{ bc }};box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif">
  <span class="ic" style="font-size:20px;flex:none;color:{{ fg }};margin-top:1px">{{ icon }}</span>
  <div style="display:flex;flex-direction:column;gap:4px;flex:1">
    <span style="font-size:14px;font-weight:600;line-height:1.5;color:{{ fg }}">{{ title }}</span>
    <sc-if value="{{ text }}">
      <span style="font-size:14px;line-height:1.5;color:var(--text2)">{{ text }}</span>
    </sc-if>
  </div>
  <span class="ic" style="font-size:18px;flex:none;color:var(--text2);cursor:pointer">close</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:80},&quot;intent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;info&quot;,&quot;err&quot;],&quot;default&quot;:&quot;info&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aviso del sistema&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MAP = {
  ok: { bg: 'var(--ok-bg)', fg: 'var(--ok-fg)', bc: 'var(--ok)', icon: 'check_circle' },
  info: { bg: 'var(--info-bg)', fg: 'var(--info-fg)', bc: 'var(--info)', icon: 'info' },
  err: { bg: 'var(--err-bg)', fg: 'var(--err-fg)', bc: 'var(--err)', icon: 'error' }
};
class Component extends DCLogic {
  renderVals() {
    const m = MAP[this.props.intent] || MAP.info;
    return { bg: m.bg, fg: m.fg, bc: m.bc, icon: m.icon, title: this.props.title ?? '', text: this.props.text || '' };
  }
}
</script>
</body>
</html>
