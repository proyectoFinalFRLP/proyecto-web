<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="./theme.css" />
</helmet>
<div class="{{ themeClass }}" style="width:1280px;height:1024px;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:64px 1fr;background:var(--bg);box-sizing:border-box;overflow:hidden">
  <div style="grid-row:1 / span 2">
    <dc-import name="SideNav" active="ordenes" hint-size="240px,100%" style="width:240px;height:100%"></dc-import>
  </div>
  <dc-import name="TopBar" tenant="{{ tenant }}" initials="{{ initials }}" hint-size="100%,64px" style="width:100%;height:64px"></dc-import>
  <div style="padding:32px;display:flex;flex-direction:column;gap:24px;min-height:0;min-width:0;box-sizing:border-box">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:baseline;gap:16px">
        <span style="font-size:24px;font-weight:600;line-height:1.25;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif">Nueva orden</span>
        <span style="font-size:14px;line-height:1.5;color:var(--text2);font-family:'Plus Jakarta Sans',sans-serif">Cliente y productos</span>
        <span style="margin-left:auto;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:0.05em;text-transform:uppercase;color:var(--primary);font-family:'Plus Jakarta Sans',sans-serif">Paso 1 de 3</span>
      </div>
      <dc-import name="ProgressBar" value="33" tone="tonal" hint-size="100%,4px" style="width:100%"></dc-import>
    </div>
    <div style="background:var(--surface);border:1px solid var(--b1);border-radius:12px;box-shadow:var(--sh1);padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="ic" style="font-size:20px;color:var(--primary)">badge</span>
        <span style="font-size:18px;font-weight:600;line-height:1.35;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif">Datos del cliente</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <dc-import name="Field" label="Nombre y apellido" value="Marina Rodríguez" hint-size="100%,80px" style="width:100%"></dc-import>
        <dc-import name="Field" label="DNI / CUIT" mono="{{ true }}" value="20-31298744-9" hint-size="100%,80px" style="width:100%"></dc-import>
        <dc-import name="Field" label="Correo electrónico" icon="mail" value="m.rodriguez@globaltech.com.ar" hint-size="100%,80px" style="width:100%"></dc-import>
        <dc-import name="Field" label="Teléfono" mono="{{ true }}" placeholder="+54 11 0000-0000" hint-size="100%,80px" style="width:100%"></dc-import>
      </div>
    </div>
    <dc-import name="DataTable" title="Productos" actionLabel="Agregar SKU" cols="{{ cols }}" rows="{{ rows }}" footer="3 SKU seleccionados · las cantidades ajustan el peso estimado" actions="{{ true }}" hint-size="100%,300px" style="width:100%"></dc-import>
    <div style="background:var(--surface);border:1px solid var(--b1);border-radius:12px;box-shadow:var(--sh1);padding:16px 24px;display:flex;align-items:center;gap:16px;box-sizing:border-box">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:12px;font-weight:700;line-height:1.4;letter-spacing:0.05em;text-transform:uppercase;color:var(--text2);font-family:'Plus Jakarta Sans',sans-serif">Peso total estimado</span>
        <span style="font-size:14px;line-height:1.5;color:var(--text2);font-family:'Plus Jakarta Sans',sans-serif">Calculado sobre el peso unitario declarado de cada SKU.</span>
      </div>
      <span style="margin-left:auto;font-size:32px;font-weight:700;line-height:1.15;color:var(--primary);font-family:'Space Grotesk',sans-serif">46,9 kg</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <dc-import name="Btn" label="Cancelar orden" variant="ghost" size="md" icon="close" hint-size="150px,40px"></dc-import>
      <div style="margin-left:auto">
        <dc-import name="Btn" label="Siguiente: destino y origen" variant="solid" size="lg" iconRight="arrow_forward" hint-size="280px,48px"></dc-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1024},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Oscuro&quot;,&quot;Claro&quot;],&quot;default&quot;:&quot;Oscuro&quot;,&quot;tsType&quot;:&quot;'Oscuro'|'Claro'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      themeClass: this.props.theme === 'Claro' ? 'light' : 'dark',
      tenant: this.props.tenant ?? 'Precision Logistics',
      initials: this.props.initials ?? 'MR',
      cols: [
        { label: 'SKU', w: '130px', mono: true },
        { label: 'Producto', w: 'minmax(0,1fr)' },
        { label: 'Categoría', w: '120px' },
        { label: 'Peso unitario', w: '120px', align: 'right', mono: true },
        { label: 'Cantidad', w: '96px', align: 'right', mono: true }
      ],
      rows: [
        { cells: [{ t: 'PX-9021-LRG', link: true }, { t: 'Router industrial de alta densidad' }, { t: 'Electronics', muted: true }, { t: '1,2 kg' }, { t: '12', strong: true }] },
        { cells: [{ t: 'PX-1185-MED', link: true }, { t: 'Sensor de presión X4' }, { t: 'Machinery', muted: true }, { t: '0,4 kg' }, { t: '50', strong: true }] },
        { cells: [{ t: 'PX-4420-XT', link: true }, { t: 'Precinto de carga reforzado 10 m' }, { t: 'Cabling', muted: true }, { t: '2,5 kg' }, { t: '5', strong: true }] }
      ]
    };
  }
}
</script>
</body>
</html>
