<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="./theme.css" />
</helmet>
<div class="{{ themeClass }}" style="width:1280px;height:1024px;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:64px 1fr;background:var(--bg);box-sizing:border-box;overflow:hidden">
  <div style="grid-row:1 / span 2">
    <dc-import name="SideNav" active="inicio" hint-size="240px,100%" style="width:240px;height:100%"></dc-import>
  </div>
  <dc-import name="TopBar" tenant="{{ tenant }}" initials="{{ initials }}" hint-size="100%,64px" style="width:100%;height:64px"></dc-import>
  <div style="padding:32px;display:flex;flex-direction:column;gap:24px;min-height:0;box-sizing:border-box">
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:24px;font-weight:600;line-height:1.25;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif">Panel de operación</span>
        <span style="font-size:14px;line-height:1.5;color:var(--text2);font-family:'Plus Jakarta Sans',sans-serif">Datos en vivo de los centros de distribución.</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <dc-import name="Btn" label="Exportar CSV" variant="outline" size="md" icon="download" hint-size="150px,40px"></dc-import>
        <dc-import name="Btn" label="Nueva orden" variant="solid" size="md" icon="add" hint-size="150px,40px"></dc-import>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
      <dc-import name="MetricCard" icon="local_shipping" label="Envíos activos" value="1.284" chip="+12%" dir="up" hint-size="100%,150px"></dc-import>
      <dc-import name="MetricCard" icon="schedule" label="Órdenes pendientes" value="3.092" note="Cola de procesamiento estable" hint-size="100%,150px"></dc-import>
      <dc-import name="MetricCard" icon="monitor_heart" label="Salud del sistema" value="99,9%" chip="+0,1%" dir="up" hint-size="100%,150px"></dc-import>
      <dc-import name="MetricCard" icon="warning" label="Alertas de inventario" value="24" chip="Crítico" critical="{{ true }}" note="Requiere revisión inmediata" hint-size="100%,150px"></dc-import>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;min-height:0">
      <dc-import name="DataTable" title="Órdenes recientes" actionLabel="Ver todas" cols="{{ cols }}" rows="{{ rows }}" footer="Mostrando 1 a 5 de 24 resultados" pages="{{ pages }}" actions="{{ true }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import>
      <div style="display:flex;flex-direction:column;gap:24px;min-height:0">
        <div style="background:var(--surface);border:1px solid var(--b1);border-radius:12px;box-shadow:var(--sh1);padding:16px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px;font-weight:600;line-height:1.35;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif">Integraciones</span>
            <span class="ic" style="font-size:18px;margin-left:auto;color:var(--text2)">hub</span>
          </div>
          <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:32px;height:32px;flex:none;border-radius:8px;background:var(--container);display:flex;align-items:center;justify-content:center">
                <span class="ic" style="font-size:18px;color:var(--text2)">{{ n.icon }}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <span style="font-size:14px;font-weight:600;line-height:1.5;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ n.name }}</span>
                <span style="font-size:11px;font-weight:500;line-height:1.4;color:{{ n.subColor }};font-family:'Space Grotesk',sans-serif">{{ n.sub }}</span>
              </div>
              <div style="margin-left:auto;display:flex;align-items:center">
                <span class="ic" style="font-size:16px;color:{{ n.stateColor }}">{{ n.stateIcon }}</span>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="background:var(--surface);border:1px solid var(--b1);border-radius:12px;box-shadow:var(--sh1);padding:16px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box">
          <span style="font-size:18px;font-weight:600;line-height:1.35;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif">Capacidad por depósito</span>
          <dc-import name="ProgressBar" label="CD Ezeiza (BUE-4)" value="85" pct="85%" tone="tonal" hint-size="100%,44px"></dc-import>
          <dc-import name="ProgressBar" label="CD Córdoba (COR-1)" value="62" pct="62%" tone="ok" hint-size="100%,44px"></dc-import>
          <dc-import name="ProgressBar" label="CD Rosario (ROS-2)" value="94" pct="94%" tone="err" hint-size="100%,44px"></dc-import>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1024},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Oscuro&quot;,&quot;Claro&quot;],&quot;default&quot;:&quot;Oscuro&quot;,&quot;tsType&quot;:&quot;'Oscuro'|'Claro'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      themeClass: this.props.theme === 'Claro' ? 'light' : 'dark',
      tenant: this.props.tenant ?? 'Precision Logistics',
      initials: this.props.initials ?? 'MR',
      cols: [
        { label: 'ID de orden', w: '108px', mono: true },
        { label: 'Destino', w: '1fr' },
        { label: 'Total', w: '92px', align: 'right', mono: true },
        { label: 'Estado', w: '100px' },
        { label: 'Fecha', w: '84px', align: 'right' }
      ],
      rows: [
        { cells: [{ t: '#ORD-8829-X', link: true }, { t: 'CABA', sub: 'Buenos Aires' }, { t: '$1.478.300', strong: true }, { t: 'Pagada', intent: 'ok' }, { t: 'Hoy', sub: '14:20', muted: true }] },
        { cells: [{ t: '#ORD-8828-A', link: true }, { t: 'Córdoba', sub: 'Córdoba' }, { t: '$890.050', strong: true }, { t: 'Pendiente', intent: 'neutral' }, { t: 'Ayer', sub: '09:30', muted: true }] },
        { cells: [{ t: '#ORD-8827-C', link: true }, { t: 'Rosario', sub: 'Santa Fe' }, { t: '$4.500.000', strong: true }, { t: 'Pagada', intent: 'ok' }, { t: '24 ago', sub: '2026', muted: true }] },
        { cells: [{ t: '#ORD-8826-D', link: true }, { t: 'Mendoza', sub: 'Mendoza' }, { t: '$320.000', strong: true }, { t: 'Cancelada', intent: 'err' }, { t: '23 ago', sub: '2026', muted: true }], hl: true },
        { cells: [{ t: '#ORD-8825-B', link: true }, { t: 'La Plata', sub: 'Buenos Aires' }, { t: '$212.500', strong: true }, { t: 'Pendiente', intent: 'neutral' }, { t: '23 ago', sub: '2026', muted: true }] }
      ],
      pages: ['1*', '2', '3', '…'],
      nodes: [
        { icon: 'dns', name: 'ERP Gateway A', sub: 'Sincronizado hace 2 ms', subColor: 'var(--text2)', stateIcon: 'check_circle', stateColor: 'var(--ok)' },
        { icon: 'storage', name: 'Inventario central', sub: 'Sincronizado hace 12 ms', subColor: 'var(--text2)', stateIcon: 'check_circle', stateColor: 'var(--ok)' },
        { icon: 'hub', name: 'API Andreani', sub: 'Tiempo de espera agotado', subColor: 'var(--err)', stateIcon: 'error', stateColor: 'var(--err)' }
      ]
    };
  }
}
</script>
</body>
</html>
