<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:240px;height:100%;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box">
  <div style="height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);box-sizing:border-box">
    <div style="width:28px;height:28px;flex:none;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center">
      <span class="ic" style="font-size:18px;color:var(--on-primary)">inventory_2</span>
    </div>
    <span style="font-size:16px;font-weight:700;line-height:1.3;color:var(--text);letter-spacing:-0.01em">Precision OMS</span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:4px;padding:16px 12px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;background:{{ it.bg }};box-sizing:border-box" style-hover="background:var(--primary-soft)">
        <span class="ic" style="font-size:20px;flex:none;color:{{ it.color }}">{{ it.icon }}</span>
        <span style="font-size:14px;line-height:1.5;font-weight:{{ it.weight }};color:{{ it.color }}">{{ it.label }}</span>
      </div>
    </sc-for>
  </nav>
  <div style="margin-top:auto;padding:16px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;box-sizing:border-box" style-hover="background:var(--primary-soft)">
      <span class="ic" style="font-size:20px;flex:none;color:var(--text2)">help</span>
      <span style="font-size:14px;line-height:1.5;color:var(--text2)">Centro de ayuda</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;box-sizing:border-box" style-hover="background:var(--err-bg)">
      <span class="ic" style="font-size:20px;flex:none;color:var(--err)">logout</span>
      <span style="font-size:14px;line-height:1.5;color:var(--err)">Cerrar sesión</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:960},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;ordenes&quot;,&quot;inventario&quot;,&quot;envios&quot;,&quot;reportes&quot;,&quot;integraciones&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = [
  { id: 'inicio', label: 'Inicio', icon: 'dashboard' },
  { id: 'ordenes', label: 'Órdenes', icon: 'shopping_cart' },
  { id: 'inventario', label: 'Inventario', icon: 'inventory_2' },
  { id: 'envios', label: 'Envíos', icon: 'local_shipping' },
  { id: 'reportes', label: 'Reportes', icon: 'bar_chart' },
  { id: 'integraciones', label: 'Integraciones', icon: 'hub' }
];
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'inicio';
    return {
      items: NAV.map(n => ({
        label: n.label,
        icon: n.icon,
        bg: n.id === active ? 'var(--primary-soft)' : 'transparent',
        color: n.id === active ? 'var(--primary)' : 'var(--text2)',
        weight: n.id === active ? '600' : '400'
      }))
    };
  }
}
</script>
</body>
</html>
