<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:8px;font-family:'Plus Jakarta Sans',sans-serif">
  <sc-if value="{{ label }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="font-size:14px;line-height:1.5;color:var(--text)">{{ label }}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="ic" style="font-size:14px;flex:none;color:{{ fill }}">{{ icon }}</span>
        <span style="font-size:14px;font-weight:500;line-height:1.4;color:{{ fill }};font-family:'Space Grotesk',sans-serif">{{ pct }}</span>
      </div>
    </div>
  </sc-if>
  <div style="height:4px;border-radius:9999px;background:var(--container);overflow:hidden">
    <div style="height:4px;width:{{ w }};border-radius:9999px;background:{{ fill }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:48},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:60,&quot;tsType&quot;:&quot;number&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tonal&quot;,&quot;neutral&quot;,&quot;ok&quot;,&quot;warn&quot;,&quot;err&quot;],&quot;default&quot;:&quot;tonal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pct&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = {
  tonal: { fill: 'var(--primary)', icon: 'check' },
  neutral: { fill: 'var(--neu)', icon: 'remove' },
  warn: { fill: 'var(--warn)', icon: 'warning' },
  err: { fill: 'var(--err)', icon: 'error' },
  ok: { fill: 'var(--ok)', icon: 'check' }
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = Number(p.value ?? 0);
    const t = TONES[p.tone] || TONES.tonal;
    return { w: Math.max(0, Math.min(100, v)) + '%', fill: t.fill, icon: p.icon || t.icon, label: p.label || '', pct: p.pct ?? (v + '%') };
  }
}
</script>
</body>
</html>
