<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:9999px;background:{{ bg }};box-sizing:border-box;white-space:nowrap">
  <span class="ic" style="font-size:14px;flex:none;color:{{ fg }}">{{ icon }}</span>
  <span style="font-size:11px;font-weight:500;line-height:1.4;color:{{ fg }};font-family:'Plus Jakarta Sans',sans-serif">{{ label }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:48},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Estado&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;warn&quot;,&quot;err&quot;,&quot;info&quot;,&quot;neutral&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MAP = {
  ok: { bg: 'var(--ok-bg)', fg: 'var(--ok-fg)', icon: 'check_circle' },
  warn: { bg: 'var(--warn-bg)', fg: 'var(--warn-fg)', icon: 'warning' },
  err: { bg: 'var(--err-bg)', fg: 'var(--err-fg)', icon: 'error' },
  info: { bg: 'var(--info-bg)', fg: 'var(--info-fg)', icon: 'local_shipping' },
  neutral: { bg: 'var(--neu-bg)', fg: 'var(--neu-fg)', icon: 'schedule' }
};
class Component extends DCLogic {
  renderVals() {
    const m = MAP[this.props.intent] || MAP.neutral;
    return { bg: m.bg, fg: m.fg, icon: this.props.icon || m.icon, label: this.props.label ?? 'Estado' };
  }
}
</script>
</body>
</html>
