<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:64px;display:flex;align-items:center;gap:16px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border);font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box">
  <span style="font-size:12px;font-weight:700;line-height:1.4;letter-spacing:0.05em;text-transform:uppercase;color:var(--primary)">{{ tenant }}</span>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;width:280px;padding:0 12px;border-radius:8px;background:var(--input);border:1px solid var(--border);box-sizing:border-box">
    <span class="ic" style="font-size:18px;flex:none;color:var(--text2)">search</span>
    <span style="font-size:14px;line-height:1.5;color:var(--text2);opacity:.7">Buscar orden, SKU o envío</span>
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <div style="position:relative;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--primary-soft)">
      <span class="ic" style="font-size:20px;color:var(--text2)">notifications</span>
      <div style="position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:9999px;background:var(--err);border:1px solid var(--surface)"></div>
    </div>
    <div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--primary-soft)">
      <span class="ic" style="font-size:20px;color:var(--text2)">settings</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--border)">
    <div style="width:32px;height:32px;border-radius:9999px;background:var(--container);display:flex;align-items:center;justify-content:center">
      <span style="font-size:11px;font-weight:500;line-height:1.4;color:var(--text)">{{ initials }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:64},&quot;tenant&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Precision Logistics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MR&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      tenant: this.props.tenant ?? 'Precision Logistics',
      initials: this.props.initials ?? 'MR'
    };
  }
}
</script>
</body>
</html>
